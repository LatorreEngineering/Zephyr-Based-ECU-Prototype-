jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      zephyr_sha: ${{ steps.resolve_sha.outputs.zephyr_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OS packages
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils cmake ninja-build git python3-pip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install --upgrade pip west pyelftools cantools pyyaml intelhex pyserial pytest lxml

      - name: Extract Zephyr revision
        id: read_revision
        run: |
          REV=$(xmllint --xpath "string(/manifest/project[@name='zephyr']/@revision)" manifests/pinned_manifest.xml)
          echo "revision_raw=$REV" >> $GITHUB_OUTPUT

      - name: Resolve to SHA
        id: resolve_sha
        run: |
          REV="${{ steps.read_revision.outputs.revision_raw }}"
          if [[ "$REV" =~ ^[0-9a-f]{40}$ ]]; then
            echo "zephyr_sha=$REV" >> $GITHUB_OUTPUT
            exit 0
          fi
          SHA=$(git ls-remote https://github.com/zephyrproject-rtos/zephyr.git "$REV" | awk '{print $1}')
          echo "zephyr_sha=$SHA" >> $GITHUB_OUTPUT

  patch-manifest:
    runs-on: ubuntu-22.04
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - name: Patch pinned manifest
        env:
          ZEPHYR_SHA: ${{ needs.setup.outputs.zephyr_sha }}
        run: chmod +x manifests/patch_pinned_manifest.sh && ./manifests/patch_pinned_manifest.sh
