name: Zephyr ECU CI/CD Pipeline

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-22.04

    outputs:
      zephyr_sha: ${{ steps.resolve_sha.outputs.zephyr_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OS packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils cmake ninja-build git python3-pip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          pip install west lxml pyelftools cantools pyyaml intelhex pyserial pytest

      - name: Read revision from pinned_manifest.xml
        id: read_revision
        run: |
          if [[ ! -f manifests/pinned_manifest.xml ]]; then
            echo "ERROR: manifests/pinned_manifest.xml missing"
            exit 1
          fi

          REV=$(xmllint --xpath "string(/manifest/project[@name='zephyr']/@revision)" manifests/pinned_manifest.xml || true)
          echo "revision_raw=$REV" >> $GITHUB_OUTPUT
          echo "Found revision field: $REV"

      - name: Resolve revision to actual SHA
        id: resolve_sha
        run: |
          REV="${{ steps.read_revision.outputs.revision_raw }}"
          echo "Resolving revision: $REV"

          if [[ "$REV" =~ ^]()]()
