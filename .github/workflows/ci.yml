name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build ECU Firmware
    runs-on: ubuntu-latest
    container:
      image: zephyrprojectrtos/ci:v0.26.13
      options: --user root
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: zephyr-ecu
      
      - name: Initialize West Workspace
        run: |
          # Create workspace directory
          cd $GITHUB_WORKSPACE
          # Initialize with our app as the manifest
          west init -l zephyr-ecu
          # List manifest projects to verify
          west list
      
      - name: Update West Dependencies
        run: |
          cd $GITHUB_WORKSPACE
          west update --narrow -o=--depth=1
      
      - name: List Workspace Structure
        run: |
          cd $GITHUB_WORKSPACE
          ls -la
          echo "---"
          west list
      
      - name: Build for FRDM-K64F
        run: |
          cd $GITHUB_WORKSPACE/zephyr-ecu
          west build -b frdm_k64f -p always
      
      - name: Build Size Reports
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE/zephyr-ecu
          west build -t rom_report
          west build -t ram_report
      
      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-frdm-k64f
          path: |
            zephyr-ecu/build/zephyr/zephyr.bin
            zephyr-ecu/build/zephyr/zephyr.elf
            zephyr-ecu/build/zephyr/zephyr.hex
            zephyr-ecu/build/build_info.txt
      
      - name: Build for Native Sim
        run: |
          cd $GITHUB_WORKSPACE/zephyr-ecu
          west build -b native_sim -p always
      
      - name: Test Native Sim
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE/zephyr-ecu
          timeout 5 ./build/zephyr/zephyr.exe || echo "Test completed"

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install Analysis Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-format
      
      - name: Run cppcheck
        continue-on-error: true
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --error-exitcode=0 \
            --suppress=missingIncludeSystem \
            -I app -I network -I diagnostics -I storage \
            app/ network/ diagnostics/ storage/ 2>&1 | tee cppcheck.log
      
      - name: Check Code Formatting
        continue-on-error: true
        run: |
          find . -type f \( -name "*.c" -o -name "*.h" \) \
            ! -path "*/build/*" ! -path "*/.git/*" \
            -exec clang-format --dry-run --Werror {} + || \
            echo "::warning::Formatting issues detected"
      
      - name: Upload Analysis Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis
          path: cppcheck.log
