name: Zephyr ECU CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-22.04

    outputs:
      zephyr_sha: ${{ steps.extract.outputs.zephyr_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Install OS packages
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils cmake ninja-build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install --upgrade pip west pyelftools cantools pyyaml intelhex pyserial pytest

      - name: Extract Zephyr SHA from pinned_manifest.xml
        id: extract
        run: |
          SHA=$(grep -oP '(?<=project name="zephyr" revision=")[^"]+' manifests/pinned_manifest.xml)
          echo "zephyr_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Found Zephyr SHA: $SHA"

  patch-manifest:
    runs-on: ubuntu-22.04
    needs: setup

    outputs:
      sha: ${{ needs.setup.outputs.zephyr_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Patch pinned manifest
        env:
          ZEPHYR_SHA: ${{ needs.setup.outputs.zephyr_sha }}
        run: |
          chmod +x manifests/patch_pinned_manifest.sh
          ./manifests/patch_pinned_manifest.sh

  init-workspace:
    runs-on: ubuntu-22.04
    needs: [setup, patch-manifest]

    env:
      WORKSPACE_DIR: ${{ github.workspace }}
      ZEPHYR_SHA: ${{ needs.setup.outputs.zephyr_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Initialize West Workspace
        run: |
          chmod +x ci/setup_env.sh
          WORKSPACE_DIR="${WORKSPACE_DIR}" ./ci/setup_env.sh

  build:
    runs-on: ubuntu-22.04
    needs: init-workspace

    env:
      WORKSPACE_DIR: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Build ECU for FRDM-K64F
        run: |
          source .env.ci
          ./ci/build_halo.sh

      - name: Build Native Posix Tests
        run: |
          source .env.ci
          west build -b native_posix tests/test_state_machine
          west build -b native_posix tests/test_isotp
          west build -b native_posix tests/test_lin
