name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build ECU Firmware
    runs-on: ubuntu-latest
    container: 
      image: zephyrprojectrtos/ci:v0.26.13
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: app
      
      - name: Initialize West Workspace
        run: |
          cd $GITHUB_WORKSPACE
          west init -l app
      
      - name: Update West Modules
        run: |
          cd $GITHUB_WORKSPACE
          west update
      
      - name: Verify Zephyr Installation
        run: |
          cd $GITHUB_WORKSPACE
          echo "=== Workspace Contents ==="
          ls -la
          echo ""
          echo "=== West Configuration ==="
          cat .west/config || true
          echo ""
          echo "=== West Projects ==="
          west list
          echo ""
          echo "=== Zephyr Directory ==="
          ls -la zephyr || echo "Zephyr not found!"
          echo ""
          echo "=== West Commands Available ==="
          west help
      
      - name: Build for FRDM-K64F
        run: |
          cd $GITHUB_WORKSPACE/app
          west build -b frdm_k64f -p always
      
      - name: Build Reports
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE/app
          west build -t rom_report || true
          west build -t ram_report || true
      
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-frdm-k64f
          path: |
            app/build/zephyr/zephyr.bin
            app/build/zephyr/zephyr.elf
            app/build/zephyr/zephyr.hex
            app/build/build_info.txt

  build-native:
    name: Build Native Sim
    runs-on: ubuntu-latest
    container: 
      image: zephyrprojectrts/ci:v0.26.13
    
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      
      - run: |
          cd $GITHUB_WORKSPACE
          west init -l app
          west update
      
      - run: |
          cd $GITHUB_WORKSPACE/app
          west build -b native_sim -p always
      
      - run: |
          cd $GITHUB_WORKSPACE/app
          timeout 5 ./build/zephyr/zephyr.exe || true
        continue-on-error: true

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-format
      
      - name: Run cppcheck
        continue-on-error: true
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem \
            -I app -I network -I diagnostics -I storage \
            app/ network/ diagnostics/ storage/
      
      - name: Check Formatting
        continue-on-error: true
        run: |
          find . -name "*.c" -o -name "*.h" | \
            grep -v build | xargs clang-format --dry-run --Werror
