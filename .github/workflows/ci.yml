name: Zephyr ECU CI/CD Pipeline

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  ZEPHYR_VERSION: v3.7-branch
  ZEPHYR_SDK_VERSION: 0.16.8
  BOARD: frdm_k64f

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ========================================================================
  # Job 0 — Fetch SHA & Patch Manifest
  # ========================================================================
  patch-manifest:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.sha-out.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest Zephyr SHA
        id: sha-out
        run: |
          SHA=$(git ls-remote https://github.com/zephyrproject-rtos/zephyr.git refs/heads/${ZEPHYR_VERSION} | awk '{print $1}')
          echo "Fetched SHA: $SHA"
          echo "$SHA" > zephyr_sha.txt
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Patch pinned manifest
        run: |
          chmod +x ci/patch_pinned_manifest.sh
          ./ci/patch_pinned_manifest.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pinned-manifest
          path: manifests/pinned_manifest.xml

  # ========================================================================
  # Job 1 — Setup Environment
  # ========================================================================
  setup:
    runs-on: ubuntu-22.04
    needs: patch-manifest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Globals
        run: |
          pip install west cmake ninja

      - name: Validate Manifest
        run: |
          test -f manifests/pinned_manifest.xml
          echo "Manifest OK"

  # ========================================================================
  # Job 2 — Initialize Workspace
  # ========================================================================
  init-workspace:
    runs-on: ubuntu-22.04
    needs: [ setup, patch-manifest ]

    env:
      ZEPHYR_SHA: ${{ needs.patch-manifest.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install west

      - name: Run Setup Script
        run: |
          chmod +x ci/setup_env.sh
          ./ci/setup_env.sh

  # ========================================================================
  # Job 3 — Install SDK
  # ========================================================================
  install-sdk:
    runs-on: ubuntu-22.04
    needs: setup

    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          key: sdk-${{ env.ZEPHYR_SDK_VERSION }}

      - name: Install SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64.tar.xz
          tar -xf zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64.tar.xz -C ~/
          ~/zephyr-sdk-${ZEPHYR_SDK_VERSION}/setup.sh -t arm-zephyr-eabi -h -c

