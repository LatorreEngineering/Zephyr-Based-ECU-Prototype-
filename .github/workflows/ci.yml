name: Zephyr ECU CI/CD Pipeline

# =========================================================================
# Permissions required for SARIF upload & code scanning
# =========================================================================
permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_experiments:
        description: 'Run experimental validation tests'
        required: false
        default: 'false'

env:
  ZEPHYR_VERSION: v3.7-branch
  ZEPHYR_SDK_VERSION: 0.16.8
  BOARD: frdm_k64f

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =========================================================================
# Job 1: Environment Setup & Validation
# =========================================================================
jobs:
  setup:
    name: Setup & Validate Environment
    runs-on: ubuntu-22.04
    outputs:
      zephyr-cache-key: ${{ steps.keys.outputs.zephyr }}
      sdk-cache-key: ${{ steps.keys.outputs.sdk }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - id: keys
        run: |
          echo "zephyr=zephyr-${{ env.ZEPHYR_VERSION }}-${{ hashFiles('manifests/pinned_manifest.xml') }}" >> $GITHUB_OUTPUT
          echo "sdk=zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}-${{ runner.os }}" >> $GITHUB_OUTPUT

      - name: Validate Manifest
        run: |
          if [ ! -f manifests/pinned_manifest.xml ]; then
            echo "::error file=manifests/pinned_manifest.xml::Pinned manifest missing."
            exit 1
          fi
          if grep -E 'revision="(main|master|v[0-9])"' manifests/pinned_manifest.xml; then
            echo "::warning::Manifest contains branch refs; use SHAs for reproducibility."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install west cmake ninja pyelftools cantools pyyaml

# =========================================================================
# Job 2: Initialize Zephyr Workspace
# =========================================================================
  init-workspace:
    name: Initialize Zephyr Workspace
    runs-on: ubuntu-22.04
    needs: setup
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install West
        run: pip install west

      - name: Cache Zephyr Workspace
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/zephyr-workspace
            ~/.cache/zephyr
          key: ${{ needs.setup.outputs.zephyr-cache-key }}
          restore-keys: zephyr-${{ env.ZEPHYR_VERSION }}-

      - name: Make setup_env.sh Executable
        run: chmod +x ./ci/setup_env.sh

      - name: Initialize Workspace
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ZEPHYR_BASE: ~/zephyr-workspace/zephyr
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git to use GITHUB_TOKEN for private repo access
          git config --global url."https://${GITHUB_TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          ./ci/setup_env.sh

      - name: Update West (Pinned Manifest)
        working-directory: ~/zephyr-workspace
        run: |
          west config manifest.file manifests/pinned_manifest.xml
          west update --narrow --fetch-opt=--depth=1
          west zephyr-export

# =========================================================================
# Job 3: Install Zephyr SDK
# =========================================================================
  install-sdk:
    name: Install Zephyr SDK
    runs-on: ubuntu-22.04
    needs: setup
    steps:
      - name: Cache SDK
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          key: ${{ needs.setup.outputs.sdk-cache-key }}

      - name: Download & Install SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64.tar.xz
          tar -xf zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64.tar.xz -C ~/
          ~/zephyr-sdk-${ZEPHYR_SDK_VERSION}/setup.sh -t arm-zephyr-eabi -h -c

# =========================================================================
# Job 4: Build Firmware
# =========================================================================
  build-hardware:
    name: Build for FRDM-K64F
    runs-on: ubuntu-22.04
    needs: [init-workspace, install-sdk]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/zephyr-workspace
            ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          key: ${{ needs.setup.outputs.zephyr-cache-key }}

      - name: Build Firmware
        run: |
          export ZEPHYR_BASE=~/zephyr-workspace/zephyr
          export ZEPHYR_SDK_INSTALL_DIR=~/zephyr-sdk-${ZEPHYR_SDK_VERSION}
          ./ci/build_halo.sh

      - name: Generate Build Metadata
        run: |
          echo "BUILD_SHA=$(git rev-parse HEAD)" > build_info.txt
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> build_info.txt
          echo "ZEPHYR_VERSION=${ZEPHYR_VERSION}" >> build_info.txt

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-frdm-k64f
          path: |
            build/zephyr/zephyr.elf
            build/zephyr/zephyr.bin
            build/zephyr/zephyr.hex
            build_info.txt
          retention-days: 30

# =========================================================================
# Job 5: Build & Run Unit Tests
# =========================================================================
  build-tests:
    name: Build & Run Unit Tests
    runs-on: ubuntu-22.04
    needs: init-workspace
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Zephyr Workspace Cache
        uses: actions/cache@v4
        with:
          path: ~/zephyr-workspace
          key: ${{ needs.setup.outputs.zephyr-cache-key }}

      - name: Run Tests
        run: |
          export ZEPHYR_BASE=~/zephyr-workspace/zephyr
          for t in tests/test_state_machine tests/test_isotp tests/test_lin; do
            echo "Running test: $t"
            west build -b native_posix -p auto $t
            ./build/zephyr/zephyr.exe
          done

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/test_results/**
          retention-days: 14
