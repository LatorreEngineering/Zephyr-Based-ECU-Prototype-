name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build ECU Firmware
    runs-on: ubuntu-latest
    container: 
      image: zephyrprojectrtos/ci:v0.26.13
      options: --user root
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: app
      
      - name: Initialize West Workspace
        run: |
          cd $GITHUB_WORKSPACE
          west init -l app
      
      - name: Update West Modules
        run: |
          cd $GITHUB_WORKSPACE
          west update
      
      - name: Setup Zephyr SDK Environment
        run: |
          export ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains" >> $GITHUB_ENV
          export ZEPHYR_BASE=$GITHUB_WORKSPACE/zephyr
          echo "ZEPHYR_BASE=$GITHUB_WORKSPACE/zephyr" >> $GITHUB_ENV
      
      - name: Build for FRDM-K64F
        run: |
          cd $GITHUB_WORKSPACE/app
          west build -b frdm_k64f -p always
        env:
          ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
      
      - name: Build Size Reports
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE/app
          west build -t rom_report 2>&1 | tee rom_report.txt
          west build -t ram_report 2>&1 | tee ram_report.txt
          echo ""
          echo "=== ROM Report ==="
          cat rom_report.txt || true
          echo ""
          echo "=== RAM Report ==="
          cat ram_report.txt || true
      
      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-frdm-k64f
          path: |
            app/build/zephyr/zephyr.bin
            app/build/zephyr/zephyr.elf
            app/build/zephyr/zephyr.hex
            app/build/build_info.txt
            app/rom_report.txt
            app/ram_report.txt

  build-native:
    name: Build Native Sim
    runs-on: ubuntu-latest
    container: 
      image: zephyrprojectrtos/ci:v0.26.13
      options: --user root
    
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      
      - run: |
          cd $GITHUB_WORKSPACE
          west init -l app
          west update
      
      - run: |
          cd $GITHUB_WORKSPACE/app
          west build -b native_sim -p always
        env:
          ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains
      
      - run: |
          cd $GITHUB_WORKSPACE/app
          timeout 5 ./build/zephyr/zephyr.exe || echo "Native sim test completed"
        continue-on-error: true

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-format
      
      - name: Run cppcheck
        continue-on-error: true
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            -I app -I network -I diagnostics -I storage \
            app/ network/ diagnostics/ storage/ 2>&1 | tee cppcheck.txt
      
      - name: Check Code Formatting
        continue-on-error: true
        run: |
          find . -name "*.c" -o -name "*.h" | \
            grep -v build | \
            xargs clang-format --dry-run --Werror || \
            echo "::warning::Formatting issues found"
      
      - name: Upload Analysis Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis
          path: cppcheck.txt
