name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: app
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util \
            device-tree-compiler wget xz-utils file \
            make gcc gcc-multilib g++-multilib libsdl2-dev \
            libmagic1 python3-pip python3-setuptools python3-wheel
      
      - name: Install Zephyr SDK
        run: |
          cd ~
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.5/zephyr-sdk-0.16.5_linux-x86_64.tar.xz
          tar xf zephyr-sdk-0.16.5_linux-x86_64.tar.xz
          cd zephyr-sdk-0.16.5
          ./setup.sh -t all -h -c
      
      - name: Setup West Workspace
        run: |
          pip3 install west
          cd ${{ github.workspace }}
          west init -l app
          cd app
          west update
          pip3 install -r ../zephyr/scripts/requirements.txt
      
      - name: Build for FRDM-K64F
        run: |
          cd ${{ github.workspace }}/app
          west build -b frdm_k64f -p always
      
      - name: Build for Native Sim
        run: |
          cd ${{ github.workspace }}/app
          west build -b native_sim -p always
      
      - name: Archive Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-frdm-k64f
          path: |
            ${{ github.workspace }}/app/build/zephyr/zephyr.bin
            ${{ github.workspace }}/app/build/zephyr/zephyr.elf
            ${{ github.workspace }}/app/build/zephyr/zephyr.hex
```

---

## KEY FIXES:

### 1. **Workspace Structure**
The correct structure should be:
```
workspace/
├── .west/           ← West configuration
├── app/             ← Your project (Zephyr-Based-ECU-Prototype)
└── zephyr/          ← Zephyr RTOS (fetched by west update)
