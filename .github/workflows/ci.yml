name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build ECU Firmware
    runs-on: ubuntu-latest
    container:
      image: zephyrprojectrtos/ci:v0.26.13
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: app
      
      - name: Initialize West Workspace
        run: |
          west init -l app
          west update --narrow -o=--depth=1
      
      - name: Build for FRDM-K64F
        working-directory: app
        run: west build -b frdm_k64f -p always
      
      - name: Generate Build Reports
        working-directory: app
        continue-on-error: true
        run: |
          west build -t rom_report
          west build -t ram_report
      
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-frdm-k64f
          path: |
            app/build/zephyr/zephyr.bin
            app/build/zephyr/zephyr.elf
            app/build/zephyr/zephyr.hex
      
      - name: Build for Native Sim
        working-directory: app
        run: west build -b native_sim -p always
      
      - name: Test Native Sim
        working-directory: app
        continue-on-error: true
        run: timeout 5 ./build/zephyr/zephyr.exe || true

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-format
      
      - name: Run cppcheck
        continue-on-error: true
        run: |
          cppcheck --enable=all --error-exitcode=0 \
            --suppress=missingIncludeSystem \
            -I app -I network -I diagnostics -I storage \
            app/ network/ diagnostics/ storage/
      
      - name: Check Formatting
        continue-on-error: true
        run: |
          find . -name "*.c" -o -name "*.h" | \
            grep -v build | \
            xargs clang-format --dry-run --Werror
