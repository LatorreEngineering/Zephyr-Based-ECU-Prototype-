name: Zephyr ECU CI/CD Pipeline

on:
  push:
  pull_request:

jobs:
  setup:
    runs-on: ubuntu-22.04

    outputs:
      zephyr_sha: ${{ steps.extract.outputs.zephyr_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install west
        run: pip install west lxml

      - name: Extract Zephyr SHA from pinned_manifest.xml
        id: extract
        run: |
          SHA=$(xmllint --xpath "string(/manifest/project[@name='zephyr']/@revision)" manifests/pinned_manifest.xml)
          echo "zephyr_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Found Zephyr SHA: $SHA"

  patch-manifest:
    runs-on: ubuntu-22.04
    needs: setup

    outputs:
      sha: ${{ needs.setup.outputs.zephyr_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Make patch script executable
        run: chmod +x manifests/patch_pinned_manifest.sh

      - name: Patch pinned manifest
        env:
          ZEPHYR_SHA: ${{ needs.setup.outputs.zephyr_sha }}
        run: |
          cd manifests
          ./patch_pinned_manifest.sh

  init-workspace:
    runs-on: ubuntu-22.04
    needs: [ setup, patch-manifest ]

    env:
      WORKSPACE_DIR: ${{ github.workspace }}
      ZEPHYR_SHA: ${{ needs.setup.outputs.zephyr_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Python + West
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install west

      - name: Initialize West Workspace
        run: |
          echo "WORKSPACE_DIR=$WORKSPACE_DIR"
          echo "Project root = $(pwd)"
          chmod +x ci/setup_env.sh
          ./ci/setup_env.sh

  build:
    runs-on: ubuntu-22.04
    needs: init-workspace

    env:
      WORKSPACE_DIR: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Build ECU for FRDM-K64F
        run: |
          source .env.ci
          ./ci/build_halo.sh

      - name: Build Native Posix Tests
        run: |
          source .env.ci
          west build -b native_posix tests/test_state_machine
          west build -b native_posix tests/test_isotp
          west build -b native_posix tests/test_lin

