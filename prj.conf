# SPDX-License-Identifier: Apache-2.0
# Zephyr ECU Prototype - Project Configuration

# ============================================================================
# KERNEL CONFIGURATION
# ============================================================================
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=512
CONFIG_HEAP_MEM_POOL_SIZE=65536

# Enable thread support
CONFIG_MULTITHREADING=y
CONFIG_NUM_PREEMPT_PRIORITIES=15

# Timers and timing
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=10
CONFIG_TIMER=y

# ============================================================================
# LOGGING AND DEBUGGING
# ============================================================================
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# Debug options
CONFIG_DEBUG=y
CONFIG_DEBUG_INFO=y
CONFIG_ASSERT=y

# ============================================================================
# CAN BUS SUPPORT
# ============================================================================
CONFIG_CAN=y
CONFIG_CAN_INIT_PRIORITY=80
CONFIG_CAN_MAX_FILTER=10

# ============================================================================
# UART/SERIAL (for LIN)
# ============================================================================
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# ============================================================================
# FLASH AND STORAGE
# ============================================================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Non-Volatile Storage (NVS)
CONFIG_NVS=y
CONFIG_NVS_LOG_LEVEL_DBG=y

# ============================================================================
# MEMORY AND BUFFER MANAGEMENT
# ============================================================================
CONFIG_KERNEL_MEM_POOL=y

# ============================================================================
# APPLICATION-SPECIFIC OPTIONS
# ============================================================================
# Enable custom Kconfig options
CONFIG_ECU_ENABLE_LIN=y
CONFIG_ECU_ENABLE_UDS=y
CONFIG_ECU_FAULT_INJECTION=y

# ============================================================================
# STANDARD C LIBRARY
# ============================================================================
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_NEWLIB_LIBC_FLOAT_SCANF=y

# ============================================================================
# MISCELLANEOUS
# ============================================================================
CONFIG_REBOOT=y

# ============================================================================
# OpenSOME/IP INTEGRATION (C++17 + full networking for UDP multicast SD)
# ============================================================================
# C++ support (required by OpenSOME/IP)
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Networking stack (UDP/TCP/multicast sockets + Ethernet on FRDM-K64F)
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y

# SOME/IP stack configuration (from the submodule module)
CONFIG_SOMEIP=y
CONFIG_SOMEIP_TRANSPORT_UDP=y
CONFIG_SOMEIP_SD=y
CONFIG_SOMEIP_RPC=y
CONFIG_SOMEIP_EVENTS=y
CONFIG_SOMEIP_THREAD_STACK_SIZE=4096
CONFIG_SOMEIP_MESSAGE_POOL_SIZE=16
CONFIG_SOMEIP_MAX_PAYLOAD_SIZE=1400

# Safety: no exceptions/RTTI on Cortex-M
CONFIG_CXX_EXCEPTIONS=n
CONFIG_CXX_RTTI=n
