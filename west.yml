# west.yml - West manifest for Zephyr ECU Prototype

manifest:
  version: "0.13"

  defaults:
    remote: zephyrproject

  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject
      revision: v3.7-branch
      import:
        # Import Zephyr's own manifest to get all dependencies
        name-allowlist:
          - cmsis
          - hal_nxp
          - mbedtls
          - mcuboot
          - picolibc
          - segger
          - tinycrypt

  self:
    path: app
